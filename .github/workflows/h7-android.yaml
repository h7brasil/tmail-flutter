name: H7 Mail — Android APK

# Build proprio do fork: nao usa Fastlane, Firebase nem certificados Apple.
# O upstream (build.yaml) depende de secrets que este fork nao tem.
on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Modo de build"
        type: choice
        options: [release, debug]
        default: release
  push:
    branches: [h7-rebrand]

env:
  FLUTTER_VERSION: 3.38.9
  JAVA_VERSION: "17"

jobs:
  android:
    name: APK
    runs-on: ubuntu-latest
    env:
      # O contexto `secrets` nao existe em `if:` de step — so `env`. Por isso a
      # presenca da keystore vira uma variavel booleana aqui no nivel do job.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: deps-${{ hashFiles('pubspec.lock') }}

      # O app le configurations/env.fcm em tempo de build. Push esta desativado
      # (FCM_AVAILABLE/IOS_FCM vazios no env.file), entao um stub vazio basta e
      # evita depender de um projeto Firebase.
      - name: Stub do env.fcm
        run: |
          mkdir -p configurations
          : > configurations/env.fcm

      # Sem os secrets o build.gradle cai na keystore de debug: o APK sai
      # instalavel, mas nao publicavel. Com eles, sai assinado de producao.
      - name: Configurar assinatura de release
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE" | base64 -d > android/h7mail-release.p12
          # storeFile absoluto de proposito: o key.properties e lido de android/,
          # mas o file() que o resolve roda em android/app/. Caminho relativo aqui
          # aponta para android/app/ e o Gradle falha com "Keystore file not found".
          cat > android/key.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/android/h7mail-release.p12
          storeType=PKCS12
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF
          # Falha cedo e com mensagem clara se a keystore nao abrir. A saida vai
          # para arquivo para nao arriscar vazar nada no log.
          keytool -list -keystore android/h7mail-release.p12 -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" > /tmp/ks.txt
          echo "Keystore aberta. Entradas de chave privada:"
          grep -i "PrivateKeyEntry" /tmp/ks.txt | cut -d, -f1

      - name: Prebuild (pub get + build_runner + l10n)
        run: ./scripts/prebuild.sh

      # Depois do prebuild de proposito: boa parte da suite so compila com os mocks
      # que o build_runner gera. Ate aqui o workflow so buildava, entao CI verde
      # significava apenas "compilou" — o fix do refresh token (3076ed5) subiu com 91
      # testes que nunca rodaram neste pipeline.
      - name: Testes
        run: flutter test

      # O versionCode nunca foi numerado: o pubspec nao tem build number, entao a base
      # era sempre 1 e o --split-per-abi so somava o offset da ABI (1000/2000/4000).
      # Todo build saia identico — 2001 / 0.33.0 — e nao dava para saber pelo aparelho
      # qual APK estava instalado. Foi assim que um APK com correcao ficou parado sem
      # ninguem perceber. run_number e monotonico e pequeno; run_id (~3e10) estouraria
      # o teto de versionCode do Android (2100000000).
      - name: Numerar o build
        id: versao
        run: |
          set -euo pipefail
          BASE=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "name=${BASE}+${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "versionName=${BASE}+${{ github.run_number }} (versionCode base ${{ github.run_number }}; arm64 = 2000 + base)" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Build APK
        run: |
          flutter build apk --${{ github.event.inputs.build_mode || 'release' }} --split-per-abi \
            --build-name="${{ steps.versao.outputs.name }}" \
            --build-number="${{ steps.versao.outputs.code }}"

      # Verificacao de verdade: sem `|| true`, para que uma assinatura invalida
      # derrube o build em vez de passar despercebida. A saida vai para o log e
      # tambem para o resumo — o log e o que da para auditar pela API.
      - name: Verificar assinatura do APK
        run: |
          set -euo pipefail
          APK=$(ls build/app/outputs/flutter-apk/app-arm64-v8a-*.apk | head -1)
          ls -lh build/app/outputs/flutter-apk/*.apk | awk '{print $9, $5}'

          if [ "$HAS_KEYSTORE" != "true" ]; then
            echo "Sem keystore nos secrets: APK assinado com chave de debug, nao publicavel."
            exit 0
          fi

          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "ERRO: apksigner nao encontrado; nao da para atestar a assinatura."
            exit 1
          fi

          "$APKSIGNER" verify -v --print-certs "$APK" | tee /tmp/verify.txt
          # v2 e o minimo aceitavel: v1 sozinho e vulneravel ao Janus (CVE-2017-13156)
          grep -q "^Verified using v2 scheme.*true" /tmp/verify.txt
          # E precisa ser a chave de producao, nao a de debug
          if grep -qi "CN=Android Debug" /tmp/verify.txt; then
            echo "ERRO: APK assinado com a chave de DEBUG."
            exit 1
          fi
          grep -q "CN=H7 Mail" /tmp/verify.txt
          echo "OK: assinado com a chave de producao da H7."

          {
            echo '### Assinatura'
            echo '```'
            grep -iE "^Verified using|Signer #1 certificate (DN|SHA-256)" /tmp/verify.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: h7mail-android-${{ github.event.inputs.build_mode || 'release' }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
